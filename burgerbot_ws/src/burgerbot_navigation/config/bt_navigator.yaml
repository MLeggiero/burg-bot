bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /burgerbot_controller/odom
    transform_tolerance: 0.3
    default_server_timeout: 1000
    bt_loop_duration: 10
    wait_for_service_timeout: 1000
    # Overridden at launch time in navigation.launch.py with the real
    # installed path -- these two are dead defaults, kept only so this file
    # is still valid on its own (e.g. loaded directly for testing) rather
    # than requiring the launch-time override to be meaningful at all.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
